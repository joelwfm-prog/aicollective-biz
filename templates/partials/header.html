  <header class="header" id="header">
    <div class="container header__inner">
      <a href="/index.html" class="brand" aria-label="{{attr site.brandName}} home">
        <svg class="brand__logo" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <path d="M17 2 4 9.5v15L17 32l13-7.5v-15L17 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 9v16M9.5 13.25 17 17l7.5-3.75M9.5 20.75 17 17M24.5 20.75 17 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity="0.65"/>
          <circle cx="17" cy="17" r="3" fill="currentColor"/>
        </svg>
        <span class="brand__name">{{site.brandNameLead}} <span>{{site.brandNameAccent}}</span></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <div class="nav__links">
{{#each nav}}
          <a class="nav__link" href="{{attr href}}"{{#if current}} aria-current="page"{{/if}}>{{label}}</a>
{{/each}}
        </div>
        <div class="header__actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Switch to light mode"></button>
          <a href="{{attr headerCtaHref}}" class="btn btn--primary">{{site.headerCta.label}}</a>
          <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
        </div>
      </nav>
    </div>
  </header>
  <div class="mobile-nav" id="mobileNav">
    <div class="mobile-nav__head">
      <span class="brand__name">{{site.brandNameLead}} <span style="color:var(--neon-cyan)">{{site.brandNameAccent}}</span></span>
      <button class="theme-toggle" id="mobileClose" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mobile-nav__links">
{{#each nav}}
      <a href="{{attr href}}">{{label}}</a>
{{/each}}
    </div>
  </div>
