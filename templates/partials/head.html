  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{attr meta.title}}</title>
  <meta name="description" content="{{attr meta.description}}" />
{{#if meta.robots}}
  <meta name="robots" content="{{attr meta.robots}}" />
{{/if}}
{{#if meta.canonical}}
  <link rel="canonical" href="{{attr meta.canonical}}" />
{{/if}}
  <meta property="og:title" content="{{attr meta.ogTitle}}" />
  <meta property="og:description" content="{{attr meta.ogDescription}}" />
  <meta property="og:type" content="{{attr meta.ogType}}" />
  <meta property="og:url" content="{{attr meta.ogUrl}}" />
  <meta property="og:site_name" content="{{attr site.siteName}}" />
  <meta property="og:image" content="{{attr meta.ogImage}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{attr meta.ogImageAlt}}" />
  <meta name="twitter:image" content="{{attr meta.ogImage}}" />
{{#if meta.twitterCard}}
  <meta name="twitter:card" content="{{attr meta.twitterCard}}" />
{{/if}}
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
