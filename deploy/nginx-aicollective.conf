# /etc/nginx/sites-available/aicollective.biz
# The AI Collective — static site + /api proxy to the Node intake/newsletter backend.
#
# After placing this file:
#   sudo ln -s /etc/nginx/sites-available/aicollective.biz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Cloudflare sits in front (orange cloud). Set Cloudflare SSL/TLS mode to
# "Full (strict)" and install an Origin Certificate on this droplet, OR run
# certbot for a Let's Encrypt cert. See deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name aicollective.biz www.aicollective.biz;

    root /var/www/aicollective;
    index index.html;

    # Static assets with sane caching
    location ~* \.(?:css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # API -> Node backend on 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clean URLs + SPA-ish fallback to the requested .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Redirect www -> apex (optional; Cloudflare can also do this)
    if ($host = www.aicollective.biz) {
        return 301 https://aicollective.biz$request_uri;
    }
}
